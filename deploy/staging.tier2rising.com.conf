# /etc/apache2/sites-available/staging.tier2rising.com.conf
#
# Port 80 for the STAGING site — redirect everything to HTTPS, except Let's
# Encrypt's ACME challenge, which must stay reachable over plain HTTP or
# `certbot renew` fails and the certificate silently expires at 90 days.
#
# Enable this file BEFORE requesting the certificate. certbot needs to answer a
# challenge on http://staging.tier2rising.com/.well-known/acme-challenge/ and
# cannot do that until Apache is already serving the name on port 80.

<VirtualHost *:80>
    ServerName staging.tier2rising.com

    DocumentRoot /var/www/html

    # Keep ACME challenges on HTTP and off the proxy.
    Alias /.well-known/acme-challenge /var/www/html/.well-known/acme-challenge
    <Directory /var/www/html/.well-known/acme-challenge>
        Options -Indexes
        Require all granted
    </Directory>

    RewriteEngine on
    RewriteCond %{REQUEST_URI} !^/\.well-known/acme-challenge/
    RewriteCond %{SERVER_NAME} =staging.tier2rising.com
    RewriteRule ^ https://%{SERVER_NAME}%{REQUEST_URI} [END,NE,R=permanent]

    ErrorLog  ${APACHE_LOG_DIR}/tier2staging_error.log
    CustomLog ${APACHE_LOG_DIR}/tier2staging_access.log combined
</VirtualHost>
