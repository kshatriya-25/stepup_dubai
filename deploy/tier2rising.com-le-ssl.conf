# /etc/apache2/sites-available/tier2rising.com-le-ssl.conf
#
# Port 443 — Apache serves the heavy static assets straight off disk and proxies
# everything else to the Next.js process. Only HTML and /api/* touch Node.
#
# This replaces the old pure-docroot config. The certificate, ServerName and
# ServerAlias are unchanged, so certbot does NOT need to run again.
#
# ── Two paths to check before enabling ──────────────────────────────────────
# REPO must be the directory where `npm run build` runs (it contains .next/ and
# public/). PORT must be free — `ss -tlnp` to confirm nothing else holds it.

Define REPO /var/www/tier2expo/stepup_dubai
Define PORT 3211

<IfModule mod_ssl.c>
<VirtualHost *:443>
    ServerName tier2rising.com
    ServerAlias www.tier2rising.com

    # Only a fallback for the Alias rules below; Next serves the real pages.
    DocumentRoot ${REPO}/public

    Protocols h2 http/1.1

    # --- static off disk, never through Node --------------------------------
    # Next's own build output plus everything in public/. Serving these from
    # Apache keeps images and the 2.7 MB hero video out of the Node process.
    Alias /_next/static ${REPO}/.next/static
    Alias /logos        ${REPO}/public/logos
    Alias /posters      ${REPO}/public/posters
    Alias /happens      ${REPO}/public/happens
    Alias /brand        ${REPO}/public/brand
    Alias /video        ${REPO}/public/video

    <Directory ${REPO}/public>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>
    <Directory ${REPO}/.next/static>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>

    # --- deny VCS metadata --------------------------------------------------
    # The docroot sits inside a git checkout; scanners actively probe /.git/config.
    <DirectoryMatch "/\.git">
        Require all denied
    </DirectoryMatch>
    <FilesMatch "^\.git">
        Require all denied
    </FilesMatch>
    # .env holds the SMTP password. It is outside DocumentRoot, but deny it by
    # name too — a future Alias or symlink must not be able to expose it.
    <FilesMatch "^\.env">
        Require all denied
    </FilesMatch>

    # --- proxy the rest to Next ---------------------------------------------
    ProxyPreserveHost On
    ProxyPass        /_next/static !
    ProxyPass        /logos !
    ProxyPass        /posters !
    ProxyPass        /happens !
    ProxyPass        /brand !
    ProxyPass        /video !
    ProxyPass        /.well-known/acme-challenge !
    ProxyPass        / http://127.0.0.1:${PORT}/
    ProxyPassReverse / http://127.0.0.1:${PORT}/

    # Registrations post through here; give the SMTP round-trip room to finish.
    ProxyTimeout 60

    # --- caching -------------------------------------------------------------
    # Images, logos and the hero video are content-stable: cache hard.
    <LocationMatch "^/(logos|posters|happens|video|brand)/">
        Header set Cache-Control "public, max-age=31536000, immutable"
    </LocationMatch>

    # Next's build assets are content-hashed -> immutable.
    <LocationMatch "^/_next/static/">
        Header set Cache-Control "public, max-age=31536000, immutable"
    </LocationMatch>

    # The registration endpoint must never be cached by anything.
    <LocationMatch "^/api/">
        Header set Cache-Control "no-store"
    </LocationMatch>

    # NOTE: the old `<FilesMatch "\.html$">` no-cache rule is gone — no .html
    # files are served off disk any more. Next sets its own headers on HTML.
    # `ErrorDocument 404 /404.html` and `DirectoryIndex index.html` are gone for
    # the same reason: Next renders its own 404.

    # --- compression ---------------------------------------------------------
    # Text only. Never gzip the mp4 or the JPEGs.
    AddOutputFilterByType DEFLATE text/html text/css application/javascript \
                                  application/json image/svg+xml text/plain

    # --- hardening -----------------------------------------------------------
    Header always set X-Content-Type-Options "nosniff"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
    Header always set X-Frame-Options "SAMEORIGIN"

    ErrorLog  ${APACHE_LOG_DIR}/tier2rising_error.log
    CustomLog ${APACHE_LOG_DIR}/tier2rising_access.log combined

Include /etc/letsencrypt/options-ssl-apache.conf
SSLCertificateFile /etc/letsencrypt/live/tier2rising.com/fullchain.pem
SSLCertificateKeyFile /etc/letsencrypt/live/tier2rising.com/privkey.pem
</VirtualHost>
</IfModule>
