# /etc/apache2/sites-available/tier2rising.com.conf
#
# Port 80 — redirect everything to HTTPS, with one exception: Let's Encrypt's
# ACME challenge must stay reachable over plain HTTP or `certbot renew` fails
# and the certificate silently expires at 90 days.
#
# Nothing here changed when the site moved from static export to Node, apart
# from the ACME carve-out.

<VirtualHost *:80>
    ServerName tier2rising.com
    ServerAlias www.tier2rising.com

    DocumentRoot /var/www/html

    # Keep ACME challenges on HTTP and off the proxy.
    Alias /.well-known/acme-challenge /var/www/html/.well-known/acme-challenge
    <Directory /var/www/html/.well-known/acme-challenge>
        Options -Indexes
        Require all granted
    </Directory>

    RewriteEngine on
    RewriteCond %{REQUEST_URI} !^/\.well-known/acme-challenge/
    RewriteCond %{SERVER_NAME} =www.tier2rising.com [OR]
    RewriteCond %{SERVER_NAME} =tier2rising.com
    RewriteRule ^ https://%{SERVER_NAME}%{REQUEST_URI} [END,NE,R=permanent]

    ErrorLog  ${APACHE_LOG_DIR}/tier2rising_error.log
    CustomLog ${APACHE_LOG_DIR}/tier2rising_access.log combined
</VirtualHost>
