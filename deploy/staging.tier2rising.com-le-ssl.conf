# /etc/apache2/sites-available/staging.tier2rising.com-le-ssl.conf
#
# Port 443 — the STAGING copy of tier2rising.com. Same shape as the production
# vhost: Apache serves static assets off disk, everything else proxies to a
# Next.js process. Only HTML and /api/* touch Node.
#
# ── Three things to check before enabling ───────────────────────────────────
# 1. STAGING_REPO is the directory where `npm run build` runs (it must contain
#    .next/ and public/ AFTER a build — Apache will not start if .next/static
#    is missing, because the <Directory> block below points at it).
# 2. STAGING_PORT must be free:  ss -tlnp | grep 3212
# 3. The certificate must already exist, or Apache fails to start. Run certbot
#    FIRST — see deploy/STAGING.md step 3.
#
# ── Why the variable names differ from the production vhost ─────────────────
# Apache's `Define` is global to the whole config parse, not scoped to a file.
# Both vhosts live in sites-enabled and are parsed in the same pass, so reusing
# REPO/PORT here would leave two files fighting over one pair of names — and the
# failure mode is silent: staging would quietly proxy to production's port, or
# serve production's .next/. Distinct names make that impossible.

Define STAGING_REPO /var/www/tier2expo/staging/tier2
Define STAGING_PORT 3212

<IfModule mod_ssl.c>
<VirtualHost *:443>
    ServerName staging.tier2rising.com

    # Only a fallback for the Alias rules below; Next serves the real pages.
    DocumentRoot ${STAGING_REPO}/public

    Protocols h2 http/1.1

    # --- KEEP STAGING OUT OF GOOGLE -----------------------------------------
    # Without this, staging.tier2rising.com gets crawled and indexed as a second
    # copy of the whole site. That splits ranking signals against the real
    # domain and can put a half-finished page in front of a customer who
    # searched for the summit.
    #
    # Done here, in Apache, NOT with a robots.txt in public/ — public/ is
    # version-controlled and shared with production, so a robots.txt added for
    # staging would deploy straight to the live site and de-index it. This
    # header lives with the environment that needs it and cannot travel.
    #
    # `always` matters: without it the header is only set on 2xx/3xx, so a 404
    # or a 500 page would still be indexable.
    Header always set X-Robots-Tag "noindex, nofollow, noarchive"

    # --- static off disk, never through Node --------------------------------
    Alias /_next/static ${STAGING_REPO}/.next/static
    Alias /logos        ${STAGING_REPO}/public/logos
    Alias /posters      ${STAGING_REPO}/public/posters
    Alias /happens      ${STAGING_REPO}/public/happens
    Alias /brand        ${STAGING_REPO}/public/brand
    Alias /video        ${STAGING_REPO}/public/video

    <Directory ${STAGING_REPO}/public>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>
    <Directory ${STAGING_REPO}/.next/static>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>

    # --- deny VCS metadata --------------------------------------------------
    # The docroot sits inside a git checkout; scanners actively probe /.git/config.
    <DirectoryMatch "/\.git">
        Require all denied
    </DirectoryMatch>
    <FilesMatch "^\.git">
        Require all denied
    </FilesMatch>
    # .env holds the SMTP password and the Razorpay secret. It is outside
    # DocumentRoot, but deny it by name too — a future Alias or symlink must not
    # be able to expose it.
    <FilesMatch "^\.env">
        Require all denied
    </FilesMatch>

    # --- OPTIONAL: password-protect the whole staging site ------------------
    # Uncomment to put staging behind HTTP basic auth. Create the file first:
    #     sudo htpasswd -c /etc/apache2/.htpasswd-staging tier2
    #
    # Note the ACME carve-out. Without it certbot's renewal challenge gets a 401
    # and the certificate expires — the classic way a protected staging site
    # goes dark 90 days after someone set it up.
    #
    # <Location />
    #     AuthType Basic
    #     AuthName "Tier-2 Rising — staging"
    #     AuthUserFile /etc/apache2/.htpasswd-staging
    #     Require valid-user
    # </Location>
    # <Location /.well-known/acme-challenge>
    #     Require all granted
    # </Location>

    # --- proxy the rest to Next ---------------------------------------------
    ProxyPreserveHost On
    ProxyPass        /_next/static !
    ProxyPass        /logos !
    ProxyPass        /posters !
    ProxyPass        /happens !
    ProxyPass        /brand !
    ProxyPass        /video !
    ProxyPass        /.well-known/acme-challenge !
    ProxyPass        / http://127.0.0.1:${STAGING_PORT}/
    ProxyPassReverse / http://127.0.0.1:${STAGING_PORT}/

    # Registrations post through here; give the SMTP round-trip room to finish.
    ProxyTimeout 60

    # --- caching -------------------------------------------------------------
    # Deliberately weaker than production. Staging exists to show the newest
    # build to a human who is about to approve it, and a day of hard-cached
    # images is exactly how someone reviews yesterday's logo and signs it off.
    <LocationMatch "^/(logos|posters|happens|brand|video)/">
        Header set Cache-Control "public, max-age=60, must-revalidate"
    </LocationMatch>

    # Next's build assets are content-hashed, so these are safe to keep long —
    # a new build produces new filenames.
    <LocationMatch "^/_next/static/">
        Header set Cache-Control "public, max-age=31536000, immutable"
    </LocationMatch>

    <LocationMatch "^/api/">
        Header set Cache-Control "no-store"
    </LocationMatch>

    # --- compression ---------------------------------------------------------
    # Text only. Never gzip the mp4 or the JPEGs.
    AddOutputFilterByType DEFLATE text/html text/css application/javascript \
                                  application/json image/svg+xml text/plain

    # --- hardening -----------------------------------------------------------
    Header always set X-Content-Type-Options "nosniff"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
    Header always set X-Frame-Options "SAMEORIGIN"

    ErrorLog  ${APACHE_LOG_DIR}/tier2staging_error.log
    CustomLog ${APACHE_LOG_DIR}/tier2staging_access.log combined

Include /etc/letsencrypt/options-ssl-apache.conf
SSLCertificateFile /etc/letsencrypt/live/staging.tier2rising.com/fullchain.pem
SSLCertificateKeyFile /etc/letsencrypt/live/staging.tier2rising.com/privkey.pem
</VirtualHost>
</IfModule>
